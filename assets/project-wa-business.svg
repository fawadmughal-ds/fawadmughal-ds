<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 214" width="580" height="214" role="img" aria-labelledby="t d">
  <title id="t">WA Business</title>
  <desc id="d">Multi-tenant WhatsApp SaaS platform with JWT auth, rotating refresh tokens, role-based access and tenant isolation. Built with FastAPI, Next.js, TypeScript, Docker.</desc>
  <defs>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="520 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .run { stroke-dasharray: 16 84; animation: run 5s linear infinite; animation-delay: -1.2s; }
      @keyframes run { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
      .ic { animation: ic 4s ease-in-out infinite; animation-delay: -1.2s; transform-box: fill-box; transform-origin: center; }
      @keyframes ic { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      .go { animation: go 1.6s ease-in-out infinite; }
      @keyframes go { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x="1.500" y="1.500" width="577" height="211" rx="16" fill="#0e0e18" stroke="#26263a" stroke-width="1.500"/>
  <rect class="run" x="1.500" y="1.500" width="577" height="211" rx="16" fill="none" stroke="url(#brand)" stroke-width="2.500" stroke-linecap="round" pathLength="100"/>
  <rect x="28" y="24" width="48" height="48" rx="12" fill="#a78bfa" fill-opacity=".12"/>
  <g class="ic"><g transform="translate(52 48)" stroke="url(#brand)" fill="none"><path d="M-13-10h26a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H-3l-8 6v-6h-2a3 3 0 0 1-3-3V-7a3 3 0 0 1 3-3z" stroke-width="2.400" stroke-linejoin="round" fill="none"/></g></g>
  <text x="90" y="46" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#ececf4">WA Business</text>
  <text x="90" y="66" font-family="'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12.500" fill="#7dd3fc">fawadmughal-ds/wab</text>
  <g class="go"><path d="M530 40h16m-6-6 6 6-6 6" stroke="#9a9ab0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="28" y="104" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9a9ab0">Multi-tenant WhatsApp SaaS platform with JWT auth, rotating</text><text x="28" y="126" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9a9ab0">refresh tokens, role-based access and tenant isolation.</text>
  <rect x="28" y="170" width="72" height="24" rx="12" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".3"/><text x="64.0" y="186" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#d4c8ff" textLength="50.4" lengthAdjust="spacingAndGlyphs">FastAPI</text><rect x="108" y="170" width="72" height="24" rx="12" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".3"/><text x="144.0" y="186" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#d4c8ff" textLength="50.4" lengthAdjust="spacingAndGlyphs">Next.js</text><rect x="188" y="170" width="94" height="24" rx="12" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".3"/><text x="235.0" y="186" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#d4c8ff" textLength="72.0" lengthAdjust="spacingAndGlyphs">TypeScript</text><rect x="290" y="170" width="65" height="24" rx="12" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".3"/><text x="322.5" y="186" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#d4c8ff" textLength="43.2" lengthAdjust="spacingAndGlyphs">Docker</text>
