<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 214" width="580" height="214" role="img" aria-labelledby="t d">
  <title id="t">Asian University Analysis</title>
  <desc id="d">Interactive dashboard exploring QS World University Rankings 2024 with regional analysis, clustering and rank prediction. Built with Python, Streamlit, Jupyter.</desc>
  <defs>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="520 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .run { stroke-dasharray: 16 84; animation: run 5s linear infinite; animation-delay: -2.4s; }
      @keyframes run { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
      .ic { animation: ic 4s ease-in-out infinite; animation-delay: -2.4s; transform-box: fill-box; transform-origin: center; }
      @keyframes ic { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      .go { animation: go 1.6s ease-in-out infinite; }
      @keyframes go { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x="1.500" y="1.500" width="577" height="211" rx="16" fill="#0e0e18" stroke="#26263a" stroke-width="1.500"/>
  <rect class="run" x="1.500" y="1.500" width="577" height="211" rx="16" fill="none" stroke="url(#brand)" stroke-width="2.500" stroke-linecap="round" pathLength="100"/>
  <rect x="28" y="24" width="48" height="48" rx="12" fill="#a78bfa" fill-opacity=".12"/>
  <g class="ic"><g transform="translate(52 48)" stroke="url(#brand)" fill="none"><path d="M-13 11V1M-4.500 11V-10M4.500 11V-3M13 11V-7" stroke-width="3.400" stroke-linecap="round"/></g></g>
  <text x="90" y="46" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#ececf4">Asian University Analysis</text>
  <text x="90" y="66" font-family="'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12.500" fill="#7dd3fc">fawadmughal-ds/Top-Asian-University-Analysis-Streamlit</text>
  <g class="go"><path d="M530 40h16m-6-6 6 6-6 6" stroke="#9a9ab0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="28" y="104" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9a9ab0">Interactive dashboard exploring QS World University Rankings</text><text x="28" y="126" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9a9ab0">2024 with regional analysis, clustering and rank prediction.</text>
  <rect x="28" y="170" width="65" height="24" rx="12" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".3"/><text x="60.5" y="186" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#d4c8ff" textLength="43.2" lengthAdjust="spacingAndGlyphs">Python</text><rect x="101" y="170" width="87" height="24" rx="12" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".3"/><text x="144.5" y="186" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#d4c8ff" textLength="64.8" lengthAdjust="spacingAndGlyphs">Streamlit</text><rect x="196" y="170" width="72" height="24" rx="12" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".3"/><text x="232.0" y="186" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#d4c8ff" textLength="50.4" lengthAdjust="spacingAndGlyphs">Jupyter</text>
</svg>
