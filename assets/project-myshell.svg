<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 214" width="580" height="214" role="img" aria-labelledby="t d">
  <title id="t">MyShell</title>
  <desc id="d">A UNIX shell written in C with built-in commands like cd, jobs and kill, plus background process management. Built with C, Linux, Processes.</desc>
  <defs>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="260" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="520 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .run { stroke-dasharray: 16 84; animation: run 5s linear infinite; animation-delay: -3.6s; }
      @keyframes run { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
      .ic { animation: ic 4s ease-in-out infinite; animation-delay: -3.6s; transform-box: fill-box; transform-origin: center; }
      @keyframes ic { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      .go { animation: go 1.6s ease-in-out infinite; }
      @keyframes go { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect x="1.500" y="1.500" width="577" height="211" rx="16" fill="#0e0e18" stroke="#26263a" stroke-width="1.500"/>
  <rect class="run" x="1.500" y="1.500" width="577" height="211" rx="16" fill="none" stroke="url(#brand)" stroke-width="2.500" stroke-linecap="round" pathLength="100"/>
  <rect x="28" y="24" width="48" height="48" rx="12" fill="#a78bfa" fill-opacity=".12"/>
  <g class="ic"><g transform="translate(52 48)" stroke="url(#brand)" fill="none"><path d="M-13-8l9 8-9 8M1 9h12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g>
  <text x="90" y="46" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#ececf4">MyShell</text>
  <text x="90" y="66" font-family="'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12.500" fill="#7dd3fc">fawadmughal-ds/OS-UNIX-SHELL</text>
  <g class="go"><path d="M530 40h16m-6-6 6 6-6 6" stroke="#9a9ab0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="28" y="104" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9a9ab0">A UNIX shell written in C with built-in commands like cd, jobs</text><text x="28" y="126" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9a9ab0">and kill, plus background process management.</text>
  <rect x="28" y="170" width="29" height="24" rx="12" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".3"/><text x="42.5" y="186" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#d4c8ff" textLength="7.2" lengthAdjust="spacingAndGlyphs">C</text><rect x="65" y="170" width="58" height="24" rx="12" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".3"/><text x="94.0" y="186" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#d4c8ff" textLength="36.0" lengthAdjust="spacingAndGlyphs">Linux</text><rect x="131" y="170" width="87" height="24" rx="12" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".3"/><text x="174.5" y="186" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#d4c8ff" textLength="64.8" lengthAdjust="spacingAndGlyphs">Processes</text>
</svg>
