  <title id="t">Fawad Mughal</title>
  <desc id="d">Data Scientist and Full-Stack Web Developer based in Lahore, Pakistan. Available for freelance work.</desc>
  <defs>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="840 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="typebox"><rect width="440" height="36"/></clipPath>
    <clipPath id="frame"><rect width="1200" height="340" rx="26"/></clipPath>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <style>
      .tw { fill: #f0abfc; animation: tw 5s ease-in-out infinite; }
      @keyframes tw { 0%, 100% { opacity: .15; } 50% { opacity: .95; } }
      .nd { animation: nd 3.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes nd { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.22); } }
      .orb { animation: orb 12s ease-in-out infinite alternate; }
      @keyframes orb { from { transform: translate(0, 0); } to { transform: translate(-70px, 30px); } }
      .role { opacity: 0; animation: role 16s step-end infinite; }
      @keyframes role { 0% { opacity: 1; } 25% { opacity: 0; } 100% { opacity: 0; } }
      .cover { animation: type 16s infinite; }
      @keyframes type {
        0.00% { transform: translateX(0px); animation-timing-function: steps(14, end); }
8.50% { transform: translateX(210.0px); animation-timing-function: linear; }
20.00% { transform: translateX(210.0px); animation-timing-function: steps(14, end); }
24.25% { transform: translateX(0px); }
25.00% { transform: translateX(0px); animation-timing-function: steps(24, end); }
33.50% { transform: translateX(360.0px); animation-timing-function: linear; }
45.00% { transform: translateX(360.0px); animation-timing-function: steps(24, end); }
49.25% { transform: translateX(0px); }
50.00% { transform: translateX(0px); animation-timing-function: steps(28, end); }
58.50% { transform: translateX(420.0px); animation-timing-function: linear; }
70.00% { transform: translateX(420.0px); animation-timing-function: steps(28, end); }
74.25% { transform: translateX(0px); }
75.00% { transform: translateX(0px); animation-timing-function: steps(17, end); }
83.50% { transform: translateX(255.0px); animation-timing-function: linear; }
95.00% { transform: translateX(255.0px); animation-timing-function: steps(17, end); }
99.25% { transform: translateX(0px); }
100% { transform: translateX(0px); }
      }
      .caret { animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .live { animation: live 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes live { from { transform: scale(1); opacity: .7; } to { transform: scale(3.2); opacity: 0; } }
      .rise { opacity: 0; animation: rise .9s cubic-bezier(.2, .7, .2, 1) forwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rise, .role:first-of-type { opacity: 1; } .cover { display: none; } }
    </style>
  </defs>
